info:
  name: Rename
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v2/companies/{{companyId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |
      {
        "name": "Renamed Company"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
