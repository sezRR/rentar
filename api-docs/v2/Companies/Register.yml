info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v2/companies"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |
      {
        "name": "Example Company"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
