info:
  name: Add Employee
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v2/companies/{{companyId}}/employees"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |
      {
        "userId": {{userId}},
        "roleIds": [{{roleId}}]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
