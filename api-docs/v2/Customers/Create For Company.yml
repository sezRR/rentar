info:
  name: Create For Company
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v2/customers"
  body:
    type: json
    data: |
      {
        "userId": {{userId}},
        "companyId": {{companyId}}
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
